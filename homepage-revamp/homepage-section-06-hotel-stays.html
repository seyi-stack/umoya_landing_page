<!-- UMOYA - HOMEPAGE SECTION 06: ACCOMMODATIONS -->
<section id="umoya-accommodations" aria-label="Accommodations">
  <style>
    #umoya-accommodations {
      --cream: #F5F0EB;
      --brown: #4B2E2B;
      --terra: #D97E53;
      --terra-dk: #C06840;
      --white: #FFFFFF;
      --ease: cubic-bezier(.25,.46,.45,.94);

      background: var(--cream);
      color: var(--brown);
      padding: clamp(64px, 8vw, 112px) 0;
      overflow: hidden;
    }

    #umoya-accommodations,
    #umoya-accommodations *,
    #umoya-accommodations *::before,
    #umoya-accommodations *::after {
      box-sizing: border-box;
    }

    #umoya-accommodations .umoya-acc-wrap {
      width: min(1180px, 92vw);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, .82fr) minmax(0, 1.18fr);
      gap: clamp(34px, 6vw, 82px);
      align-items: center;
    }

    #umoya-accommodations .umoya-acc-eye {
      display: block;
      margin-bottom: 16px;
      color: var(--terra);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .24em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    #umoya-accommodations h2 {
      margin: 0 0 24px;
      color: var(--brown);
      font-size: clamp(2.1rem, 4.8vw, 4.1rem);
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.04;
    }

    #umoya-accommodations .umoya-acc-body {
      display: grid;
      gap: 18px;
      color: rgba(75,46,43,.86);
      font-size: clamp(1rem, 1.2vw, 1.06rem);
      line-height: 1.78;
    }

    #umoya-accommodations .umoya-acc-body p {
      margin: 0;
    }

    #umoya-accommodations .umoya-acc-btn {
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 32px;
      min-height: 48px;
      padding: 14px 28px;
      background: var(--terra);
      border: 2px solid var(--terra);
      border-radius: 0;
      color: var(--white);
      cursor: pointer;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .18em;
      line-height: 1.2;
      text-transform: uppercase;
      transition: background .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease);
    }

    #umoya-accommodations .umoya-acc-btn:hover {
      background: var(--terra-dk);
      border-color: var(--terra-dk);
      transform: translateY(-2px);
    }

    #umoya-accommodations .umoya-acc-gallery {
      position: relative;
      min-height: clamp(380px, 46vw, 560px);
      overflow: hidden;
      background: var(--brown);
    }

    #umoya-accommodations .umoya-acc-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      object-fit: cover;
      opacity: 0;
      transform: scale(1.02);
      transition: opacity .6s var(--ease), transform .9s var(--ease);
    }

    #umoya-accommodations .umoya-acc-image.is-active {
      opacity: 1;
      transform: scale(1);
    }

    /* Property caption — name + place over a bottom gradient */
    #umoya-accommodations .umoya-acc-cap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1;
      margin: 0;
      padding: clamp(46px, 6vw, 64px) clamp(20px, 3vw, 30px) clamp(20px, 3vw, 26px);
      background: linear-gradient(180deg, rgba(28,13,6,0) 0%, rgba(28,13,6,.68) 60%, rgba(28,13,6,.88) 100%);
      color: var(--cream);
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s var(--ease);
    }

    #umoya-accommodations .umoya-acc-cap.is-active {
      opacity: 1;
    }

    #umoya-accommodations .umoya-acc-cap-name {
      display: block;
      font-size: clamp(1.2rem, 2.2vw, 1.6rem);
      font-weight: 400;
      font-style: italic;
      line-height: 1.15;
      text-shadow: 0 2px 12px rgba(28,13,6,.55);
    }

    #umoya-accommodations .umoya-acc-cap-place {
      display: block;
      margin-top: 5px;
      color: var(--terra);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      text-shadow: 0 1px 8px rgba(28,13,6,.6);
    }

    #umoya-accommodations .umoya-acc-controls {
      position: absolute;
      right: 22px;
      bottom: 22px;
      display: flex;
      gap: 10px;
      z-index: 2;
    }

    #umoya-accommodations .umoya-acc-arrow {
      appearance: none;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 50%;
      background: rgba(75,46,43,.42);
      color: var(--white);
      cursor: pointer;
      display: grid;
      place-items: center;
      backdrop-filter: blur(8px);
      transition: background .22s var(--ease), transform .22s var(--ease);
    }

    #umoya-accommodations .umoya-acc-arrow:hover {
      background: var(--terra);
      transform: translateY(-1px);
    }

    @media (max-width: 900px) {
      #umoya-accommodations {
        padding: 54px 0 72px;
      }

      #umoya-accommodations .umoya-acc-wrap {
        grid-template-columns: 1fr;
      }

      #umoya-accommodations .umoya-acc-gallery {
        min-height: 0;
        aspect-ratio: 4 / 3;
      }
    }
  </style>

  <div class="umoya-acc-wrap">
    <div class="umoya-acc-copy">
      <span class="umoya-acc-eye">Where You'll Stay</span>
      <h2>Hotel Stays Worthy of the Journey</h2>
      <div class="umoya-acc-body">
        <p>Your accommodations are as carefully considered as every moment between them. Each property is five-star, chosen not just for its comfort, but for what it adds to the journey itself.</p>
      </div>
      <button type="button" class="umoya-acc-btn" data-umoya-form-popup>Inquire Now</button>
    </div>

    <figure class="umoya-acc-gallery" aria-label="Five-star hotel stays on the Umoya journey">
      <!-- ★ SWAP: confirm final images for The Da Vinci, MalaMala, and Cape Grace -->
      <img class="umoya-acc-image is-active" src="https://umoyaafrikatours.co.za/wp-content/uploads/2026/optimized/umoya_compressed_Davinci_Outdoor_Pool.jpg" alt="The Da Vinci Hotel — Nelson Mandela Square, Sandton" loading="eager" decoding="async">
      <img class="umoya-acc-image" src="https://umoyaafrikatours.co.za/wp-content/uploads/2025/10/umoya_image-19.jpg" alt="MalaMala — community-owned lodge in the Sabi Sand" loading="eager" decoding="async">
      <img class="umoya-acc-image" src="https://umoyaafrikatours.co.za/wp-content/uploads/2026/optimized/umoya_compressed_imgLibrary_marina_view.png" alt="Cape Grace, A Fairmont Hotel — V&A Waterfront, Cape Town" loading="eager" decoding="async">

      <!-- Property captions paired 1:1 with the images above -->
      <figcaption class="umoya-acc-cap is-active" data-acc-cap="0">
        <span class="umoya-acc-cap-name">The Da Vinci</span>
        <span class="umoya-acc-cap-place">Nelson Mandela Square, Sandton</span>
      </figcaption>
      <figcaption class="umoya-acc-cap" data-acc-cap="1">
        <span class="umoya-acc-cap-name">MalaMala</span>
        <span class="umoya-acc-cap-place">Community-Owned &middot; The Sabi Sand</span>
      </figcaption>
      <figcaption class="umoya-acc-cap" data-acc-cap="2">
        <span class="umoya-acc-cap-name">Cape Grace</span>
        <span class="umoya-acc-cap-place">A Fairmont Hotel &middot; V&amp;A Waterfront</span>
      </figcaption>

      <div class="umoya-acc-controls" aria-label="Accommodation carousel controls">
        <button class="umoya-acc-arrow" type="button" data-acc-prev aria-label="Previous accommodation image">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="umoya-acc-arrow" type="button" data-acc-next aria-label="Next accommodation image">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </figure>
  </div>

  <script>
  (function(){
    'use strict';
    var root = document.getElementById('umoya-accommodations');
    if (!root) return;

    var images = Array.prototype.slice.call(root.querySelectorAll('.umoya-acc-image'));
    var caps = Array.prototype.slice.call(root.querySelectorAll('.umoya-acc-cap'));
    var prev = root.querySelector('[data-acc-prev]');
    var next = root.querySelector('[data-acc-next]');
    var index = 0;

    function normalizeIndex(value) {
      return (value + images.length) % images.length;
    }

    function imageIsReady(image) {
      return image && image.complete && image.naturalWidth > 0;
    }

    function render(nextIndex) {
      index = normalizeIndex(nextIndex);
      images.forEach(function(img, imgIndex) {
        img.classList.toggle('is-active', imgIndex === index);
      });
      caps.forEach(function(cap, capIndex) {
        cap.classList.toggle('is-active', capIndex === index);
      });
    }

    function renderWhenDecoded(nextIndex) {
      var targetIndex = normalizeIndex(nextIndex);
      var targetImage = images[targetIndex];

      if (!targetImage || typeof targetImage.decode !== 'function') {
        render(targetIndex);
        return;
      }

      targetImage.decode().catch(function() {
        return null;
      }).then(function() {
        render(targetIndex);
      });
    }

    function requestImage(nextIndex) {
      var targetIndex = normalizeIndex(nextIndex);
      var targetImage = images[targetIndex];

      /* Avoid revealing the gallery background while a remote image is still loading. */
      if (imageIsReady(targetImage)) {
        renderWhenDecoded(targetIndex);
        return;
      }

      function cleanup() {
        targetImage.removeEventListener('load', onReady);
        targetImage.removeEventListener('error', cleanup);
      }

      function onReady() {
        cleanup();
        renderWhenDecoded(targetIndex);
      }

      targetImage.addEventListener('load', onReady, { once: true });
      targetImage.addEventListener('error', cleanup, { once: true });
    }

    prev && prev.addEventListener('click', function() { requestImage(index - 1); });
    next && next.addEventListener('click', function() { requestImage(index + 1); });
  }());
  </script>
</section>
