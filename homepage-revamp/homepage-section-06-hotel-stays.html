<!--
=================================================================
  UMOYA — HOMEPAGE (REVAMP) SECTION 06: HOTEL STAYS
  Featured hotel: CAPE GRACE (A Fairmont Hotel · V&A Waterfront)
=================================================================
  Full-bleed (edge-to-edge) cinematic carousel band.

  MOTION — rebuilt to be fail-proof:
  • The images SLIDE horizontally. Motion is driven by a JS
    requestAnimationFrame tween that writes `transform` every frame
    (NO CSS transition, NO drag) — so the slide is always visible,
    with no reliance on transition/reflow timing.
  • Auto-advances every 5s on a continuous, seamless loop
    (cloned edge slides; an instant jump off the clone keeps it
    endless). The arrows trigger the same slide.
  • Text sits FIXED, top-left, over the images and never moves.

  Tall/thin luxury line-arrows on the far left/right (no chrome,
  no hover; scale-down on click). Bottom-left note links to the
  Signature Journey stays. "Featured Hotel" badge makes clear
  Cape Grace is the featured stay, not the only one.

  Standalone Elementor HTML widget (not a generator source file).
  BRAND: font-family: inherit; palette tokens only. Scoped to
  #umoya-accommodations. ES5 IIFE, IntersectionObserver-paused when
  off-screen. Autoplay is intentional and runs regardless of the OS
  "reduce motion" setting. Each slide carries an earthy fallback
  background so the slide is visible even before/without images.
=================================================================
-->
<section id="umoya-accommodations" role="region" aria-roledescription="carousel" aria-label="Featured hotel stay — Cape Grace">
  <style>
    #umoya-accommodations {
      --cream: #F5F0EB;
      --brown: #4B2E2B;
      --terra: #D97E53;
      --terra-dk: #C06840;
      --white: #FFFFFF;
      --ease: cubic-bezier(.25,.46,.45,.94);

      position: relative;
      /* Full-bleed: break out of the centered Elementor container to span the viewport */
      width: 100vw;
      max-width: 100vw;
      margin-left: calc(50% - 50vw);
      height: clamp(580px, 82vh, 860px);
      overflow: hidden;
      background: var(--brown);
      color: var(--cream);
      font-family: inherit;
      isolation: isolate;
    }

    #umoya-accommodations *,
    #umoya-accommodations *::before,
    #umoya-accommodations *::after { box-sizing: border-box; }

    /* ── Image layer (moved by JS rAF; no CSS transition) ────── */
    #umoya-accommodations .umoya-hs-viewport {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
    #umoya-accommodations .umoya-hs-track {
      display: flex;
      flex-wrap: nowrap;
      width: 100%;
      height: 100%;
      will-change: transform;
      transform: translate3d(-100%,0,0);
    }
    #umoya-accommodations .umoya-hs-slide {
      position: relative;
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
    }
    #umoya-accommodations .umoya-hs-slide img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      max-width: none;
      object-fit: cover;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* ── Legibility scrim (darker toward the top-left text) ──── */
    #umoya-accommodations .umoya-hs-scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg,  rgba(28,13,6,.66) 0%, rgba(28,13,6,.28) 46%, rgba(28,13,6,0) 74%),
        linear-gradient(180deg, rgba(28,13,6,.54) 0%, rgba(28,13,6,.08) 42%, rgba(28,13,6,0) 64%),
        linear-gradient(0deg,   rgba(28,13,6,.34) 0%, rgba(28,13,6,0) 26%);
    }

    /* ── Fixed text content — TOP-LEFT ───────────────────────── */
    #umoya-accommodations .umoya-hs-content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      pointer-events: none;         /* clicks fall through; the CTA + note link re-enable */
    }
    #umoya-accommodations .umoya-hs-inner {
      max-width: 680px;
      /* top · right · bottom · left — left inset keeps clear of the side arrows */
      padding: clamp(84px, 15vh, 168px) clamp(24px, 4vw, 48px) 0 clamp(72px, 8vw, 132px);
    }

    #umoya-accommodations .umoya-hs-kicker {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    #umoya-accommodations .umoya-hs-eye {
      color: rgba(245,240,235,.95);
      font-size: clamp(.9rem, 1.1vw, 1.05rem);
      font-weight: 500;
      letter-spacing: .04em;        /* Title Case — not uppercased */
      text-shadow: 0 1px 8px rgba(28,13,6,.55);
    }
    #umoya-accommodations .umoya-hs-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 13px;
      background: var(--terra);
      color: var(--white);
      border-radius: 999px;
      font-size: .6rem;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 8px 22px rgba(28,13,6,.4);
    }
    #umoya-accommodations .umoya-hs-badge svg { width: 11px; height: 11px; flex: 0 0 auto; }

    #umoya-accommodations .umoya-hs-name {
      margin: 0;
      color: var(--white);
      font-size: clamp(2.9rem, 7vw, 5.4rem);
      font-weight: 400;
      line-height: 1.03;
      letter-spacing: -.005em;
      text-shadow: 0 2px 26px rgba(28,13,6,.5);
    }
    #umoya-accommodations .umoya-hs-place {
      display: block;
      margin-top: 24px;
      color: rgba(245,240,235,.92);
      font-size: clamp(1rem, 1.2vw, 1.16rem);
      line-height: 1.5;
      text-shadow: 0 1px 10px rgba(28,13,6,.5);
    }

    #umoya-accommodations .umoya-hs-btn {
      pointer-events: auto;
      appearance: none;
      -webkit-appearance: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 38px;
      min-height: 52px;
      padding: 15px 28px;
      background: transparent;
      border: 1px solid rgba(245,240,235,.6);
      border-radius: 0;
      color: var(--cream);
      cursor: pointer;
      font-size: .74rem;
      font-weight: 700;
      letter-spacing: .18em;
      line-height: 1.2;
      text-decoration: none;
      text-transform: uppercase;
      -webkit-tap-highlight-color: transparent;
      transition: background .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease);
    }
    #umoya-accommodations .umoya-hs-btn svg { width: 15px; height: 15px; flex: 0 0 auto; }
    #umoya-accommodations .umoya-hs-btn:hover {
      background: rgba(245,240,235,.12);
      border-color: var(--cream);
      transform: translateY(-2px);
    }

    /* ── Note pinned to the BOTTOM of the section ────────────── */
    #umoya-accommodations .umoya-hs-foot {
      position: absolute;
      left: 0;
      right: 0;
      bottom: clamp(28px, 4.5vh, 52px);
      z-index: 2;
      pointer-events: none;
      padding: 0 clamp(24px, 4vw, 48px) 0 clamp(72px, 8vw, 132px);
    }
    #umoya-accommodations .umoya-hs-note {
      margin: 0;
      max-width: 100%;
      color: rgba(245,240,235,.9);
      font-size: clamp(1.05rem, 1.55vw, 1.32rem);
      line-height: 1.5;
      text-shadow: 0 1px 10px rgba(28,13,6,.5);
      white-space: nowrap;          /* one line by design — see mobile override */
      overflow: hidden;
      text-overflow: ellipsis;      /* safety net only; should not trigger at normal widths */
    }
    #umoya-accommodations .umoya-hs-note a {
      pointer-events: auto;
      color: var(--terra);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      transition: color .2s var(--ease);
    }
    #umoya-accommodations .umoya-hs-note a:hover { color: var(--cream); }

    /* ── Arrows: elegant thin line-arrows, no chrome, no hover ── */
    #umoya-accommodations .umoya-hs-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 3;
      pointer-events: auto;
      display: grid;
      place-items: center;
      width: 64px;
      height: 56px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--white);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(0 1px 8px rgba(28,13,6,.65));
      transition: transform .16s var(--ease);
    }
    #umoya-accommodations .umoya-hs-arrow:active { transform: translateY(-50%) scale(.86); }
    #umoya-accommodations .umoya-hs-arrow:focus-visible { outline: 2px solid var(--cream); outline-offset: 4px; border-radius: 4px; }
    #umoya-accommodations .umoya-hs-prev { left: clamp(12px, 2vw, 34px); }
    #umoya-accommodations .umoya-hs-next { right: clamp(12px, 2vw, 34px); }
    #umoya-accommodations .umoya-hs-arrow svg { width: 56px; height: 16px; }   /* natural ratio — not stretched */

    /* ── Tablet ──────────────────────────────────────────────── */
    @media (max-width: 1024px) {
      #umoya-accommodations { height: clamp(540px, 84vh, 760px); }
      #umoya-accommodations .umoya-hs-inner { padding-left: clamp(52px, 7vw, 92px); padding-top: clamp(72px, 12vh, 128px); }
      #umoya-accommodations .umoya-hs-foot { padding-left: clamp(52px, 7vw, 92px); }
    }

    /* ── Mobile: content top-left, note bottom-left, arrows bottom-right ── */
    @media (max-width: 768px) {
      #umoya-accommodations { height: clamp(500px, 86vh, 680px); }
      #umoya-accommodations .umoya-hs-inner {
        max-width: none;
        padding: clamp(60px, 11vh, 104px) clamp(22px, 6vw, 34px) 0;
      }
      #umoya-accommodations .umoya-hs-name { font-size: clamp(2.6rem, 12vw, 3.5rem); }
      #umoya-accommodations .umoya-hs-btn { width: 100%; max-width: 340px; justify-content: center; }

      #umoya-accommodations .umoya-hs-foot {
        padding: 0 120px clamp(0px, 0vh, 0px) clamp(22px, 6vw, 34px);   /* leave room for bottom-right arrows */
        bottom: clamp(18px, 3vh, 28px);
      }
      #umoya-accommodations .umoya-hs-note {
        font-size: clamp(.98rem, 3.6vw, 1.12rem);
        max-width: none;
        white-space: normal;        /* mobile is the one place this may wrap to two lines */
        overflow: visible;
        text-overflow: clip;
      }

      #umoya-accommodations .umoya-hs-arrow {
        top: auto;
        bottom: clamp(16px, 3vh, 26px);
        transform: none;
        width: 52px;
        height: 44px;
      }
      #umoya-accommodations .umoya-hs-arrow:active { transform: scale(.86); }
      #umoya-accommodations .umoya-hs-arrow svg { width: 44px; height: 14px; }
      #umoya-accommodations .umoya-hs-prev { left: auto; right: 66px; }
      #umoya-accommodations .umoya-hs-next { right: 14px; }
    }
  </style>

  <!-- IMAGE LAYER -->
  <div class="umoya-hs-viewport" data-hs-viewport>
    <div class="umoya-hs-track" data-hs-track>
      <div class="umoya-hs-slide" role="group" aria-roledescription="slide" aria-label="Cape Grace — 1 of 4" style="background:linear-gradient(135deg,#4B2E2B,#241310);">
        <img src="https://umoyaafrikatours.co.za/wp-content/uploads/2026/optimized/umoya_compressed_Hero_Shot_Table_Mountain_(1).jpg" alt="Cape Grace on the V&amp;A Waterfront marina, with Table Mountain beyond" loading="eager" fetchpriority="high" decoding="async">
      </div>
      <div class="umoya-hs-slide" role="group" aria-roledescription="slide" aria-label="Cape Grace — 2 of 4" style="background:linear-gradient(135deg,#6a4a2e,#2f1e12);">

  </div>

  <!-- SCRIM -->
  <div class="umoya-hs-scrim" aria-hidden="true"></div>

  <!-- FIXED TEXT (top-left) -->
  <div class="umoya-hs-content">
    <div class="umoya-hs-inner">
      <div class="umoya-hs-kicker">
        <span class="umoya-hs-eye">Where You'll Stay</span>
        <span class="umoya-hs-badge">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.26L21.6 9l-5 4.6 1.3 7.4L12 17.6 6.1 21l1.3-7.4-5-4.6 6.7-.74L12 2z"/></svg>
          Featured Hotel
        </span>
      </div>
      <h2 class="umoya-hs-name">Cape Grace</h2>

  </div>

  <script>
  (function(){
    'use strict';

    var root = document.getElementById('umoya-accommodations');
    if (!root) return;

    var track = root.querySelector('[data-hs-track]');
    if (!track) return;

    var slides = Array.prototype.slice.call(track.querySelectorAll('.umoya-hs-slide'));
    var N = slides.length;
    if (N < 2) return;

    var prevBtn = root.querySelector('[data-hs-prev]');
    var nextBtn = root.querySelector('[data-hs-next]');

    /* Motion is intentional here (client wants an auto-playing slideshow), so it
       runs regardless of the OS "reduce motion" setting. Honouring reduce here
       is what silently disabled autoplay + turned the slide into a hard cut. */
    var AUTO = 5000;                 /* 5s interval */
    var SLIDE_MS = 820;              /* duration of each slide */

    /* ── Seamless infinite loop: clone last -> front, first -> end ── */
    var lastClone = slides[N - 1].cloneNode(true);
    var firstClone = slides[0].cloneNode(true);
    lastClone.setAttribute('aria-hidden', 'true');
    firstClone.setAttribute('aria-hidden', 'true');
    track.insertBefore(lastClone, slides[0]);
    track.appendChild(firstClone);
    /* DOM: [lastClone, s0..s(N-1), firstClone]; logical pos 1..N are real slides */

    var pos = 1;
    var current = -100;              /* current translateX, in % of one slide width */
    var animating = false;
    var rafId = null;
    var timer = null;
    var inView = true;

    function apply(){ track.style.transform = 'translate3d(' + current + '%,0,0)'; }

    function easeInOutCubic(t){ return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

    /* JS-driven tween — writes transform every frame, so the slide ALWAYS shows */
    function tweenTo(target, done){
      if (rafId){ cancelAnimationFrame(rafId); rafId = null; }
      if (SLIDE_MS <= 0){ current = target; apply(); if (done) done(); return; }
      var startVal = current;
      var delta = target - startVal;
      var startTs = null;
      function frame(ts){
        if (startTs === null) startTs = ts;
        var t = (ts - startTs) / SLIDE_MS;
        if (t > 1) t = 1;
        current = startVal + delta * easeInOutCubic(t);
        apply();
        if (t < 1){ rafId = requestAnimationFrame(frame); }
        else { rafId = null; current = target; apply(); if (done) done(); }
      }
      rafId = requestAnimationFrame(frame);
    }

    function go(dir){
      if (animating) return;
      animating = true;
      pos += dir;
      tweenTo(-pos * 100, function(){
        /* Landed on a clone? jump instantly onto its real twin (invisible) */
        if (pos === N + 1){ pos = 1; current = -100; apply(); }
        else if (pos === 0){ pos = N; current = -N * 100; apply(); }
        animating = false;
      });
    }

    /* ── Autoplay ─────────────────────────────────────────────── */
    function startAuto(){
      if (!inView || document.hidden || timer) return;
      timer = setInterval(function(){ go(1); }, AUTO);
    }
    function stopAuto(){ if (timer){ clearInterval(timer); timer = null; } }
    function resetAuto(){ stopAuto(); startAuto(); }

    /* ── Arrows / keyboard trigger the same slide ─────────────── */
    function manual(dir){ if (animating) return; go(dir); resetAuto(); }
    if (prevBtn) prevBtn.addEventListener('click', function(){ manual(-1); });
    if (nextBtn) nextBtn.addEventListener('click', function(){ manual(1); });
    root.addEventListener('keydown', function(e){
      if (e.key === 'ArrowLeft' || e.keyCode === 37){ manual(-1); }
      else if (e.key === 'ArrowRight' || e.keyCode === 39){ manual(1); }
    });

    /* ── Pause when off-screen or tab hidden ──────────────────── */
    if ('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        for (var i = 0; i < entries.length; i++){
          inView = entries[i].isIntersecting;
          if (inView) startAuto(); else stopAuto();
        }
      }, { threshold: 0.2 });
      io.observe(root);
    }
    document.addEventListener('visibilitychange', function(){
      if (document.hidden) stopAuto(); else startAuto();
    });

    /* ── Init ─────────────────────────────────────────────────── */
    current = -100;
    apply();
    startAuto();
  }());
  </script>
</section>
