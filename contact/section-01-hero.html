<!--
=================================================================
  UMOYA — CONTACT — SECTION 01: HERO
=================================================================
  Built from "Mockups (footer, contact)/Umoya_Contact_Page_Mockup.html".
  Layout and copy follow the mockup exactly; its fonts and sampled
  hex values do NOT come across — the routing doc is explicit that
  "the colors used in the mockup are illustrative", so this uses
  font-family: inherit and the brand palette only.

  A short centred header rather than a full-bleed image hero: the
  page's job is to get someone into a form, and every scroll before
  the first field is a cost. Anchors #ct-plan / #ct-general are
  reachable from the nav or from a campaign link.

  ELEMENTOR: place after shared/section-00-nav.html on /contact/.
  BRAND: font-family: inherit; palette tokens only. ES5 IIFE.
=================================================================
-->
<style>
  #umoya-contact-hero {
    --cream:    #F5F0EB;
    --brown:    #4B2E2B;
    --terra:    #D97E53;
    --muted:    rgba(75,46,43,.72);
    --ease:     cubic-bezier(.25,.46,.45,.94);

    font-family: inherit;
    background: var(--cream);
    color: var(--brown);
    padding: clamp(52px, 7vw, 96px) 0 clamp(30px, 4vw, 48px);
    overflow-x: hidden;
  }

  #umoya-contact-hero *,
  #umoya-contact-hero *::before,
  #umoya-contact-hero *::after { box-sizing: border-box; }

  .ct-hero-c {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 clamp(20px, 3.4vw, 48px);
    text-align: center;
  }

  .ct-hero-eye {
    display: block;
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--terra);
    margin-bottom: 1.1rem;
  }

  .ct-hero-ttl {
    font-family: inherit;
    font-size: clamp(2.1rem, 5vw, 3.6rem);
    font-weight: 400;
    line-height: 1.06;
    letter-spacing: -0.01em;
    color: var(--brown);
    margin: 0;
  }

  .ct-hero-rule {
    width: 64px;
    height: 3px;
    background: var(--terra);
    border: 0;
    margin: clamp(18px, 2.4vw, 26px) auto clamp(18px, 2.4vw, 24px);
  }

  .ct-hero-lead {
    font-family: inherit;
    font-size: clamp(1rem, 1.35vw, 1.08rem);
    line-height: 1.75;
    color: var(--muted);
    max-width: 60ch;
    margin: 0 auto;
  }

  /* ── Scroll reveal ───────────────────────────────── */
  .ct-hero-rv { opacity: 0; transform: translateY(24px); transition: opacity .8s var(--ease), transform .8s var(--ease); }
  .ct-hero-rv.ct-hero-on { opacity: 1; transform: none; }
  .ct-hero-rv.d1 { transition-delay: .12s; }

  /* ── Responsive ──────────────────────────────────── */
  @media (max-width: 768px) {
    #umoya-contact-hero { padding: 42px 0 26px; }
    .ct-hero-ttl { font-size: clamp(1.8rem, 8vw, 2.4rem); }
    .ct-hero-lead { font-size: 1rem; line-height: 1.68; }
  }

  @media (max-width: 420px) {
    #umoya-contact-hero { padding: 34px 0 22px; }
    .ct-hero-eye { font-size: 0.72rem; letter-spacing: 0.2em; }
    .ct-hero-ttl { font-size: clamp(1.65rem, 8.6vw, 2.05rem); }
  }
</style>

<section id="umoya-contact-hero" aria-labelledby="ct-hero-title">
  <div class="ct-hero-c">
    <span class="ct-hero-eye ct-hero-rv">Get in Touch</span>
    <h1 class="ct-hero-ttl ct-hero-rv" id="ct-hero-title">Talk to Us</h1>
    <hr class="ct-hero-rule ct-hero-rv d1">
    <p class="ct-hero-lead ct-hero-rv d1">Whether you are planning a journey, working with clients as a travel advisor, or writing about what we do, this is where the conversation starts. We reply within one business day.</p>
  </div>
</section>

<script>
(function(){
  'use strict';

  var els = document.querySelectorAll('#umoya-contact-hero .ct-hero-rv');
  if (!els.length) return;

  if ('IntersectionObserver' in window) {
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if (e.isIntersecting) { e.target.classList.add('ct-hero-on'); obs.unobserve(e.target); }
      });
    }, { threshold: 0.1 });
    Array.prototype.forEach.call(els, function(el){ obs.observe(el); });
  } else {
    /* No observer — show everything rather than leaving the page blank */
    Array.prototype.forEach.call(els, function(el){ el.classList.add('ct-hero-on'); });
  }
}());
</script>
