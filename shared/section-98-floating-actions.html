<!--
  UMOYA - Floating actions: WhatsApp + scroll to top (site-wide)

  Two round 56px buttons fixed to the bottom-right of the screen on every
  page. Built from the client's own snippet (02.html), with these changes:

  - Hidden while the visitor is on the hero; both slide in once the page has
    scrolled past data-show-after (60vh by default: 60% of the screen height,
    or a px value) and slide out again at the top.
  - Each button can be switched off in the widget (Content tab: "Show the
    WhatsApp button", "Show the scroll-to-top button"); off adds `hidden`.
  - Styles scoped to #umoya-float instead of !important everywhere, so the
    widget's Style tab can still change them, and the theme's button and link
    rules cannot (an id outranks them).
  - Moves itself to <body> on load: a position: fixed element inside a
    transformed ancestor (an Elementor motion effect) is pinned to that
    ancestor instead of the screen - the reason the footer's opt-out dialog
    does the same.
  - z-index sits below the cookie banner, the menu bar and every dialog, so it
    never covers their buttons.
  - With JavaScript unavailable the WhatsApp button still shows; the
    scroll-to-top button, which needs the script, does not.
  - Reduced-motion visitors get an instant jump and no slide.
-->
<div id="umoya-float" class="umoya-float-actions" role="group" aria-label="Quick actions" data-show-after="60vh">
  <!-- WhatsApp -->
  <a
    class="umoya-fab umoya-wa"
    href="https://wa.me/12403136344?text=Hi.%20I%20just%20went%20through%20the%20Umoya%20Afrika%20Tours%20website%20and%20would%20love%20to%20get%20some%20information"
    target="_blank"
    rel="noopener"
    aria-label="Chat on WhatsApp (opens in a new tab)"
  >
    <!-- WhatsApp mark on a green circle, drawn on a 56x56 canvas -->
    <svg class="umoya-wa-svg" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <rect x="0" y="0" width="56" height="56" rx="44" fill="#25D366"></rect>
      <g transform="translate(12.6667 12.6667) scale(1.9167)">
        <path
          fill="#ffffff"
          d="M13.601 2.326A7.85 7.85 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.9 7.9 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.9 7.9 0 0 0 13.6 2.326zM7.994 14.521a6.6 6.6 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.56 6.56 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592m3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.73.73 0 0 0-.529.247c-.182.198-.691.677-.691 1.654s.71 1.916.81 2.049c.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232"
        />
      </g>
    </svg>
  </a>

  <!-- Scroll to top -->
  <button class="umoya-fab umoya-top" type="button" aria-label="Scroll to top">
    <svg class="umoya-top-svg" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
      <path d="M12 5l7 7M12 5l-7 7M12 5v14" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>

<style>
  /* ===== Bar: fixed to the bottom-right of the screen ===== */
  #umoya-float {
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 12px;
    align-items: center;
    /* Above the page, below the cookie banner, the menu bar and the dialogs. */
    z-index: 999990;
    transition: opacity .25s ease, transform .25s ease, visibility 0s linear 0s;
  }

  /* Once the script runs, hidden until the page scrolls past the hero.
     visibility (not just opacity) also takes the buttons out of the tab order. */
  #umoya-float.is-armed:not(.is-shown) {
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity .25s ease, transform .25s ease, visibility 0s linear .25s;
  }

  /* Without the script, the scroll-to-top button cannot work: leave it out. */
  #umoya-float:not(.is-armed) .umoya-top { display: none; }

  /* ===== Buttons: 56x56 ===== */
  #umoya-float .umoya-fab {
    box-sizing: border-box;
    width: 56px;
    height: 56px;
    display: grid;
    place-items: center;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    line-height: 0;
    font-size: 0;
    background: transparent;
    box-shadow: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* A button switched off in the widget. */
  #umoya-float .umoya-fab[hidden] { display: none; }

  #umoya-float .umoya-fab:focus-visible {
    outline: 3px solid #4B2E2B;
    outline-offset: 3px;
  }

  /* Scroll button */
  #umoya-float .umoya-top {
    background: rgba(0,0,0,.78);
    color: #fff;
    box-shadow: 0 14px 30px rgba(0,0,0,.25);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  #umoya-float .umoya-top:hover {
    transform: translateY(-1px);
    box-shadow: 0 18px 36px rgba(0,0,0,.28);
    background: rgba(0,0,0,.86);
  }

  /* WhatsApp mark fills its 56x56 button */
  #umoya-float .umoya-wa-svg {
    width: 56px;
    height: 56px;
    display: block;
  }

  /* Arrow inside the scroll button */
  #umoya-float .umoya-top-svg {
    width: 26px;
    height: 26px;
    display: block;
  }

  /* Phones: 40px buttons (down from 56), tucked closer to the corner. */
  @media (max-width: 768px) {
    #umoya-float {
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      gap: 8px;
    }
    #umoya-float .umoya-fab { width: 40px; height: 40px; }
    #umoya-float .umoya-wa-svg { width: 40px; height: 40px; }
    #umoya-float .umoya-top-svg { width: 19px; height: 19px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #umoya-float,
    #umoya-float.is-armed:not(.is-shown),
    #umoya-float .umoya-top { transition: none; }
    #umoya-float.is-armed:not(.is-shown) { transform: none; }
  }

  @media print {
    #umoya-float { display: none; }
  }
</style>

<script>
(function () {
  'use strict';

  var bar = document.getElementById('umoya-float');
  if (!bar) return;

  // Fixed to the screen from <body>, never from inside a transformed
  // ancestor, which would pin it to that ancestor instead.
  if (bar.parentElement !== document.body) document.body.appendChild(bar);

  var topBtn = bar.querySelector('.umoya-top');
  var reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
  // In the Elementor editor the bar stays visible, so it can be found and edited.
  var editing = !!(document.body && document.body.classList.contains('elementor-editor-active'));

  // "60vh" = 60% of the screen height; "400" or "400px" = pixels.
  function threshold() {
    var raw = String(bar.getAttribute('data-show-after') || '60vh').replace(/\s+/g, '').toLowerCase();
    var amount = parseFloat(raw);
    if (isNaN(amount) || amount < 0) amount = 60;
    if (/vh$/.test(raw)) return (window.innerHeight || document.documentElement.clientHeight || 0) * amount / 100;
    return amount;
  }

  function scrollTop() {
    return window.pageYOffset || document.documentElement.scrollTop || 0;
  }

  function update() {
    var show = editing || scrollTop() > threshold();
    if (show) {
      bar.classList.add('is-shown');
    } else {
      bar.classList.remove('is-shown');
    }
  }

  bar.classList.add('is-armed');
  update();
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);

  if (!topBtn) return;

  var animating = false;

  function smoothScrollToTop(duration) {
    if (reduceMotion) {
      window.scrollTo(0, 0);
      return;
    }

    var start = scrollTop();
    var startTime = null;
    animating = true;

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function step(now) {
      if (!animating) return;
      if (startTime === null) startTime = now;
      var t = Math.min(1, (now - startTime) / duration);
      window.scrollTo(0, Math.round(start * (1 - easeOutCubic(t))));
      if (t < 1) {
        window.requestAnimationFrame(step);
      } else {
        animating = false;
      }
    }

    window.requestAnimationFrame(step);
  }

  // A visitor who scrolls or swipes mid-way takes over from the animation.
  function cancel() {
    animating = false;
  }
  window.addEventListener('wheel', cancel, { passive: true });
  window.addEventListener('touchstart', cancel, { passive: true });

  topBtn.addEventListener('click', function () {
    smoothScrollToTop(700);
  });
}());
</script>
